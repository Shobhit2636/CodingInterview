<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0e0a1f"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="40%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#7c3aed" stroke-width="8" stroke-opacity="0.3"/>
  <!-- Glowing circle halo -->
  <circle cx="256" cy="256" r="160" fill="#7c3aed" fill-opacity="0.12" filter="url(#glow)"/>
  <!-- Lightning Bolt AI Icon -->
  <path d="M280 64 L160 272 L240 272 L216 448 L352 224 L272 224 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
